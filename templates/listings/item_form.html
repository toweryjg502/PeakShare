{% extends 'base.html' %}
{% block title %}{{ heading|default:"List an Item" }}{% endblock %}
{% block content %}
<p><a href="{% url 'item_list' %}">&larr; Back to browse</a></p>

<div class="card form-card">
    <h1>{{ heading|default:"List an Item" }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ submit_label|default:"Create Listing" }}</button>
    </form>
</div>
{% endblock %}
