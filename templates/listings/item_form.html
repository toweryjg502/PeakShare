<!DOCTYPE html>
<html>
<head>
    <title>PeakShare - List an Item</title>
</head>
<body>
    <p><a href="{% url 'item_list' %}">&larr; Back to browse</a></p>
    <h2>List an Item</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Listing</button>
    </form>
</body>
</html>
