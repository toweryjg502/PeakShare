{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Student Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p class="muted">Need an account? <a href="{% url 'register' %}">Sign up here</a>.</p>
</div>
{% endblock %}
